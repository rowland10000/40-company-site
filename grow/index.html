<style>
/* Layout: phone-height column — a little stage card with the chibi characters on top, the story written below it, choices as sticky buttons. Pastel candy look on purpose, single theme. */
:root{
  --bg:#FFE9EF;
  --dot:#FFD3DF;
  --paper:#FFFBF4;
  --ink:#4A3B47;
  --soft:#9A8794;
  --line:#F3D9DF;
  --pink:#F27BA0;
  --kind:#F07CA0;
  --brave:#F2994A;
  --funny:#E9B824;
  --smart:#3FB6E0;
  --free:#4CBF86;
  --font:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  background-image:radial-gradient(var(--dot) 3px,transparent 3.5px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font-family:var(--font);cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;gap:8px;
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-block:8px 12px}
#bar{display:flex;align-items:center;gap:8px}
#bar .age{background:var(--pink);color:#fff;border-radius:999px;padding:4px 12px;font-size:16px;box-shadow:0 3px 0 #D85C86}
#bar .tt{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;box-shadow:0 2px 0 var(--line)}

#stage{position:relative;border-radius:22px;overflow:hidden;background:#fff;border:4px solid #fff;box-shadow:0 6px 0 var(--line),0 10px 24px -12px rgba(150,80,110,.4);flex:none}
#stage svg{display:block;width:100%;height:auto;max-height:36vh}
#traits{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;flex:none}
.tr{display:inline-flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.tr b{font-weight:400}
.tr i{font-style:normal}
.tr.bump{animation:bump .5s}

#log{flex:1;min-height:0;overflow-y:auto;background:var(--paper);border-radius:18px;padding:14px 16px 26px;box-shadow:inset 0 0 0 2px var(--line);

.op{text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:11px 14px;font-size:17px;line-height:1.45;box-shadow:0 4px 0 var(--ink);display:flex;gap:10px;align-items:center}

.op .lb{flex:1;min-width:0}
.op .tg{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.op.done{opacity:.4;box-shadow:none;border-style:dashed}
.op.pick{opacity:1;background:#FFF1F6;border-style:solid}
.chip{display:inline-block;border-radius:999px;color:#fff;padding:1px 10px;font-size:14px;margin:0 4px 8px 0;animation:pop .3s ease both}
#ctl{display:flex;gap:8px}

#ctl #nx{background:var(--ink);color:#fff;box-shadow:0 3px 0 #2C222A;flex:2}

.name{width:100%;box-sizing:border-box;border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:18px;color:var(--ink);background:#fff}

.ach i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:22px;color:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 3px 0 rgba(0,0,0,.08)}
.ach b{font-weight:400;font-size:13px;line-height:1.3}
.ach small{font-size:11px;color:var(--soft);line-height:1.35}

.bar{display:flex;align-items:center;gap:8px;font-size:14px}
.bar span{width:3.4em}

.bar i{display:block;height:100%;border-radius:6px}
.newb{align-self:center;background:#FFE58A;border-radius:999px;padding:3px 12px;font-size:14px}

/* sticker book */
#book .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-align:center;line-height:1.3}
.slot svg{width:100%;max-width:120px;height:auto}
.slot.off .ph{width:100%;max-width:110px;aspect-ratio:1;border-radius:50%;border:3px dashed #E5C9D2;display:grid;place-items:center;font-size:30px;color:#E5C9D2}
.slot.off span{color:#C2A8B3}
.detail{grid-column:1/-1;background:#FFF5F8;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7;border:2px solid var(--line)}
.detail b{font-weight:400;color:var(--pink);font-size:18px}

.lid ellipse{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.6s infinite;animation-delay:var(--d,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.emo{transform-box:fill-box;transform-origin:center;animation:emo .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes emo{from{transform:scale(0)}to{transform:scale(1)}}
.chr{animation:breathe 2.6s ease-in-out infinite}
.chr.b2{animation-delay:-1.3s}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}
.spk{position:absolute;pointer-events:none;font-size:15px;animation:spk .65s ease-out forwards;z-index:3}
@keyframes spk{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1);opacity:0}}
.cf{position:fixed;z-index:90;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.cf.rain{animation-name:cfr;animation-timing-function:linear}
@keyframes cfr{0%{transform:none;opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.flt{position:absolute;pointer-events:none;font-size:14px;color:#fff;border-radius:999px;padding:2px 10px;white-space:nowrap;z-index:3;animation:flt 1.1s ease-out forwards;box-shadow:0 2px 0 rgba(0,0,0,.12)}
@keyframes flt{0%{transform:translate(-50%,6px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
#tMe svg{width:120px;height:auto;display:block;animation:tmhop .9s ease-in-out infinite}
@keyframes tmhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px)}}
.mkpv{padding:8px}
.mkpv svg{width:100%;height:auto;display:block;border-radius:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 13px;font-size:15px}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.sw{border-color:#fff}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes boing{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(4px)}}
@keyframes peel{0%{transform:rotate(-30deg) scale(.2);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.hopme{animation:hop .45s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

$('stage').addEventListener('pointerdown',function(e){var r=this.getBoundingClientRect();spark(e.clientX-r.left,e.clientY-r.top,this);});
document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null;if(!b||b.classList.contains('op')||b.getAttribute('data-snd')==='0')return;SFX.tap();},true);

/* ================= 捏臉 ================= */
function maker(){
  normMe();
  var sc=$('maker');sc.innerHTML='';
  var inn=el('div','in');
  var h=el('h2','big');h.innerHTML='做一個<span>你</span>';inn.appendChild(h);
  var pv=el('div','card mkpv');inn.appendChild(pv);
  function redraw(bump){
    var s='<rect width="360" height="190" fill="#FFF5F8"/>'+rep(16,function(i){return '<circle cx="'+((i*61+13)%360)+'" cy="'+((i*37)%120+10)+'" r="2.5" fill="#FFD3DF"/>';});
    var WSC={k:.8,e:.86,j:.95,s:1,u:1,w:1,a:1,m:1,h:1,r:1,o:1};
    var list=cur==='wear'?[[wearSt,WSC[wearSt],180-60*WSC[wearSt],WLAB[wearSt]]]:[['k',.66,34,'5 歲'],['s',.8,132,'17 歲'],['a',.92,244,'30 歲']];
    list.forEach(function(a,i){
      var w=120*a[1];
      s+='<ellipse cx="'+(a[2]+w/2)+'" cy="171" rx="'+(w*.32)+'" ry="5" fill="#F6DCE4"/>';
      s+='<g'+(bump?' class="hopme" style="animation-delay:'+(i*.08)+'s"':'')+'>'+place(chibi(youLook(a[0]),bump?'h':'s'),a[2],172-160*a[1],a[1])+'</g>';
      s+='<text x="'+(a[2]+w/2)+'" y="186" text-anchor="middle" font-size="12" fill="#9A8794" font-family="Huninn,sans-serif">'+a[3]+'</text>';
    });
    pv.innerHTML=svgWrap(s,'0 0 360 190');
  }
  var TABS=[['sex','我是',[['m','男生'],['f','女生'],['n','不想說']]],['hair','髮型',HAIRS],['wear','穿搭',null],['hc','髮色',HCOL],['skin','膚色',SKIN],['eye','眼睛',EYES],['cheek','臉頰',CHEEK],['hacc','頭上',HACC],['facc','臉上',FACC],['fav','最愛的顏色',FAV],['name','名字']];
  var tabs=el('div','tabs');tabs.setAttribute('role','tablist');
  var panel=el('div','card opt');var cur='sex',wearSt='j';
  var WST=[['k','5 歲'],['e','10 歲'],['j','14 歲'],['s','17 歲'],['u','20 歲'],['w','24–28 歲'],['a','30 歲'],['m','35 歲'],['h','45 歲'],['r','65 歲'],['o','80 歲']],WLAB={};WST.forEach(function(x){WLAB[x[0]]=x[1];});
  function showTab(key){
    var was=cur;cur=key;if(was==='wear'||key==='wear')redraw();
    Array.prototype.forEach.call(tabs.children,function(t){var on=t._k===key;t.classList.toggle('on',on);t.setAttribute('aria-selected',on?'true':'false');});
    panel.innerHTML='';
    var T=TABS.filter(function(t){return t[0]===key;})[0];
    if(key==='name'){
      panel.appendChild(el('h3','','大家會用這個名字叫你'));
      var ip=el('input','name');ip.id='meName';ip.maxLength=8;ip.placeholder='不填就叫「你」';ip.value=SAVE.me.name||'';
      ip.addEventListener('input',function(){SAVE.me.name=ip.value;});panel.appendChild(ip);return;
    }
    if(key==='wear'){
      function chips(title,items,get,set){
        panel.appendChild(el('h3','',title));var r=el('div','row');
        items.forEach(function(it){var b=el('button','tx',it[1]);b.type='button';b.setAttribute('data-snd','0');if(get()===it[0])b.classList.add('on');
          b.addEventListener('click',function(){set(it[0]);Array.prototype.forEach.call(r.children,function(x){x.classList.remove('on');});b.classList.add('on');SFX.pop();redraw(true);save();});r.appendChild(b);});
        panel.appendChild(r);
      }
      function W(){var m=SAVE.me;if(!m.wear[wearSt])m.wear[wearSt]={};return m.wear[wearSt];}
      panel.appendChild(el('h3','','先選一個年紀，再換那時候的穿搭'));
      var ar=el('div','row');
      WST.forEach(function(x){var b=el('button','tx',x[1]);b.type='button';b.setAttribute('data-snd','0');if(x[0]===wearSt)b.classList.add('on');b.addEventListener('click',function(){wearSt=x[0];SFX.sheet();redraw();showTab('wear');});ar.appendChild(b);});
      panel.appendChild(ar);
      chips('下半身',[['pants','長褲'],['shorts','短褲'],['skirt','裙子']],function(){return W().b||'pants';},function(v){W().b=v;});
      chips('領口',[['auto','原本的'],['tie','領帶'],['bow','蝴蝶結'],['scarf','領巾'],['none','不要']],function(){return W().n||'auto';},function(v){W().n=v;});
      var all=el('button','tx','每個年紀都穿這樣');all.type='button';all.style.marginTop='12px';
      all.addEventListener('click',function(){var c=JSON.parse(JSON.stringify(W()));WST.forEach(function(x){SAVE.me.wear[x[0]]=JSON.parse(JSON.stringify(c));});SFX.trait.kind(0);save();all.textContent='已經套用到每個年紀了';});
      panel.appendChild(all);
      return;
    }
    if(key==='fav')panel.appendChild(el('h3','','長大以後的衣服和鞋子，會是這個顏色'));
    var isColor=typeof T[2][0]==='string';
    var r=el('div','row');
    T[2].forEach(function(it){
      var v=isColor?it:it[0];
      var b=el('button',isColor?'sw':'tx',isColor?'':it[1]);b.type='button';b.setAttribute('data-snd','0');
      if(isColor){b.style.background=it;b.setAttribute('aria-label',T[1]);}
      if(SAVE.me[key]===v)b.classList.add('on');
      b.addEventListener('click',function(){
        SAVE.me[key]=v;Array.prototype.forEach.call(r.children,function(x){x.classList.remove('on');});b.classList.add('on');
        SFX.pop();redraw(true);save();
      });
      r.appendChild(b);
    });
    panel.appendChild(r);
  }
  TABS.forEach(function(t){var b=el('button','tab',t[1]);b.type='button';b._k=t[0];b.setAttribute('role','tab');b.addEventListener('click',function(){showTab(t[0]);});tabs.appendChild(b);});
  inn.appendChild(tabs);inn.appendChild(panel);
  var rnd=el('button','btn w','隨機一個我');rnd.type='button';rnd.setAttribute('data-snd','0');
  rnd.addEventListener('click',function(){
    function p(a){return a[Math.floor(Math.random()*a.length)];}
    var m=SAVE.me;m.hair=p(HAIRS)[0];m.hc=p(HCOL);m.skin=p(SKIN);m.eye=p(EYES)[0];m.cheek=p(CHEEK)[0];m.hacc=p(HACC)[0];m.facc=p(FACC)[0];m.fav=p(FAV);
    SFX.trait.funny(0);redraw(true);showTab(cur);save();
  });
  inn.appendChild(rnd);
  var go=el('button','btn',SAVE.run?'就是我了，接著長大！':'就是我了，開始長大！');go.type='button';go.addEventListener('click',function(){save();sc.hidden=true;if(SAVE.run)resumeRun(SAVE.run);else startRun();});inn.appendChild(go);
  sc.appendChild(inn);redraw();showTab('sex');sc.hidden=false;sc.scrollTop=0;
}

/* ================= 首頁 ================= */
function home(){
  var sc=$('home');sc.innerHTML='';
  var inn=el('div','in');
  var hero=el('div','hero');
  var s=BG.kinder+FX.kinder+place(chibi(youLook('k'),'h'),70,52,.92)+place(chibi(npcLook('azhe','k'),'s'),150,58,.88)+place(chibi(npcLook('xq','k'),'w'),226,58,.88);
  hero.innerHTML=svgWrap(s,'0 0 360 200');hero.firstChild.style.width='100%';hero.firstChild.style.borderRadius='22px';hero.firstChild.style.border='4px solid #fff';
  inn.appendChild(hero);
  var h=el('h1','big');h.innerHTML='長大<span>貼紙簿</span>';inn.appendChild(h);
  inn.appendChild(el('p','sub','從 5 歲到 80 歲，跟阿哲、小晴一起長大，還會遇到更多人。每一個答案都能選，每一次選擇，都會讓你走向不一樣的人生。最後，你的一生會變成一張貼紙。'));
  if(SAVE.run){
    var cont=el('button','btn','接著玩（'+(SAVE.run.age||'')+'）');cont.type='button';cont.addEventListener('click',function(){sc.hidden=true;resumeRun(SAVE.run);});inn.appendChild(cont);
    var re=el('button','btn w','從 5 歲重新開始');re.type='button';re.addEventListener('click',function(){delete SAVE.run;save();sc.hidden=true;startRun();});inn.appendChild(re);
  }else{
  var a=el('button','btn',SAVE.runs?'再長大一次':'開始');a.type='button';
  a.addEventListener('click',function(){sc.hidden=true;if(SAVE.runs)startRun();else maker();});inn.appendChild(a);
  }
  var b=el('button','btn w','捏臉：換個樣子');b.type='button';b.addEventListener('click',function(){sc.hidden=true;maker();});inn.appendChild(b);
  var c=el('button','btn w','貼紙簿 '+foundN()+' / 15・成就 '+achN()+' / '+ACH.length);c.type='button';c.addEventListener('click',showBook);inn.appendChild(c);
  var hs=el('button','btn w','音效：'+(SAVE.mute?'關':'開'));hs.type='button';hs.id='hSnd';hs.setAttribute('data-snd','0');hs.addEventListener('click',toggleSnd);inn.appendChild(hs);
  inn.appendChild(el('p','small','點畫面看下一句。玩第二次以後，可以按「跳到下一題」快轉。進度存在這台裝置。'));
  sc.appendChild(inn);sc.hidden=false;
}
function startRun(){resetRun();$('home').hidden=true;chapter(0);}

document.addEventListener('keydown',function(e){
  if(!$('home').hidden||!$('maker').hidden||!$('end').hidden||!$('book').hidden)return;
  if(e.key===' '||e.key==='Enter'){var ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||(ae.tagName==='BUTTON'&&ae.id!=='nx')))return;e.preventDefault();advance();}
});
resetRun();$('bN').textContent=foundN();
G.ch=0;drawScene();drawTraits();
var HOT=window.claude&&window.claude.hot;
if(HOT&&HOT.snapshot){try{HOT.snapshot(function(){return {run:inGame()?snapRun():null};});}catch(e){}}
function boot(data){
  var r=(data&&data.run)||null;
  if(r){resumeRun(r);}else if(SAVE.run){resumeRun(SAVE.run);}else home();
}
if(HOT&&HOT.ready){try{HOT.ready(boot);}catch(e){boot({});}}else boot((HOT&&HOT.data)||{});
window.__cg={G:G,SAVE:function(){return SAVE;},advance:advance,ENDS:ENDS,STORY:STORY,pickEnding:pickEnding};
})();
</script>
